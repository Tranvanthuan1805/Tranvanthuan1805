 <text x="192" y="190" fill="#67E8F9" font-size="22" font-weight="700">01 · FULL-STACK ENGINEER</text><text x="192" y="235" fill="#FFFFFF" font-size="17">Frontend &amp; responsive UI</text><text x="192" y="269" fill="#FFFFFF" font-size="17">Backend &amp; REST APIs</text><text x="192" y="303" fill="#FFFFFF" font-size="17">Database &amp; authentication</text><text x="192" y="337" fill="#CBD5E1" font-size="15">Build · Integrate · Deploy</text>
 <text x="600" y="65" fill="#C4B5FD" font-size="22" font-weight="700">02 · AI APPLICATION BUILDER</text><text x="600" y="105" fill="#FFFFFF" font-size="17">LLM &amp; AI API integration</text><text x="600" y="135" fill="#FFFFFF" font-size="17">Chatbots · RAG · Automation</text><text x="600" y="163" fill="#CBD5E1" font-size="15">Turn AI into useful product features</text>
 <text x="1008" y="190" fill="#5EEAD4" font-size="22" font-weight="700">03 · BUSINESS ANALYST</text><text x="1008" y="235" fill="#FFFFFF" font-size="17">Stakeholder communication</text><text x="1008" y="269" fill="#FFFFFF" font-size="17">Requirements · SRS · Use cases</text><text x="1008" y="303" fill="#FFFFFF" font-size="17">User stories &amp; acceptance criteria</text><text x="1008" y="337" fill="#CBD5E1" font-size="15">Discover · Define · Validate</text>
