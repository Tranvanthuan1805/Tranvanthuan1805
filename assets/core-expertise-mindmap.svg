 <rect x="425" y="20" width="350" height="170" rx="22" fill="#21143E" stroke="#A78BFA" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.5s" repeatCount="indefinite"/></rect>
 <rect x="840" y="145" width="335" height="225" rx="22" fill="#0B2E3A" stroke="#2DD4BF" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></rect>
 <circle cx="600" cy="270" r="83" fill="#101F42" stroke="url(#cyan)" stroke-width="3"><animate attributeName="r" values="80;86;80" dur="3s" repeatCount="indefinite"/></circle>
</g>
