<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10102C"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
 <linearGradient id="violet"><stop stop-color="#818CF8"/><stop offset="1" stop-color="#D879F9"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="4" y="4" width="1192" height="492" rx="24" fill="url(#bg)" stroke="#334155"/>
<g fill="none" stroke-width="4" opacity=".95">
 <path d="M600 255 C500 255 450 255 360 255" stroke="url(#cyan)"><animate attributeName="stroke-dasharray" values="0 300;300 0" dur="2.8s" repeatCount="indefinite"/></path>
 <path d="M600 255 C600 190 600 155 600 125" stroke="url(#violet)"><animate attributeName="stroke-dasharray" values="0 220;220 0" dur="3.2s" repeatCount="indefinite"/></path>
 <path d="M600 255 C700 255 750 255 840 255" stroke="#2DD4BF"><animate attributeName="stroke-dasharray" values="0 300;300 0" dur="3.6s" repeatCount="indefinite"/></path>
</g>
<g filter="url(#glow)">
