<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Animated developer coding at a futuristic desk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#0b1028"/><stop offset="1" stop-color="#17052d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#00f7ff"/><stop offset="0.5" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="screenClip"><rect x="565" y="112" width="500" height="230" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <ellipse cx="790" cy="395" rx="430" ry="55" fill="#00f7ff" opacity=".08" filter="url(#shadow)"/>
  <circle cx="970" cy="75" r="90" fill="#7c4dff" opacity=".09" filter="url(#soft)"/>
  <circle cx="230" cy="110" r="70" fill="#00f7ff" opacity=".07" filter="url(#soft)"/>

  <!-- decorative grid -->
  <g opacity=".12" stroke="#8fa8ff">
    <path d="M0 420H1200M0 460H1200M0 500H1200"/>
    <path d="M80 390V520M180 390V520M280 390V520M380 390V520M480 390V520M580 390V520M680 390V520M780 390V520M880 390V520M980 390V520M1080 390V520"/>
  </g>

  <!-- title -->
  <text x="70" y="72" fill="#eafaff" font-family="monospace" font-size="25" font-weight="700">$ developer --status</text>
  <text x="70" y="108" fill="#00f7ff" font-family="monospace" font-size="17">SYSTEM ONLINE  •  CODING MODE  •  DEPLOY READY</text>

  <!-- monitor glow and frame -->
  <rect x="545" y="92" width="540" height="280" rx="20" fill="#00f7ff" opacity=".10" filter="url(#soft)"/>
  <rect x="545" y="92" width="540" height="280" rx="20" fill="#0a1020" stroke="url(#glow)" stroke-width="3"/>
  <rect x="565" y="112" width="500" height="230" rx="12" fill="#030611" stroke="#26345f"/>
  <g clip-path="url(#screenClip)" font-family="monospace" font-size="15">
    <text x="588" y="145" fill="#00f7ff">const</text><text x="642" y="145" fill="#e8efff"> founder = </text><text x="735" y="145" fill="#ff7bdc">"Thuần"</text>
    <text x="588" y="175" fill="#7c4dff">function</text><text x="675" y="175" fill="#e8efff"> buildProduct() {</text>
    <text x="612" y="205" fill="#80eaff">return</text><text x="670" y="205" fill="#e8efff"> idea</text><text x="710" y="205" fill="#a5b8ff"> → </text><text x="740" y="205" fill="#e8efff">code</text><text x="790" y="205" fill="#a5b8ff"> → </text><text x="820" y="205" fill="#e8efff">users;</text>
    <text x="588" y="235" fill="#7c4dff">}</text>
    <text x="588" y="275" fill="#5ff0a5">✓ DUO TECH</text><text x="715" y="275" fill="#e8efff"> building digital products...</text>
    <text x="588" y="305" fill="#5ff0a5">✓ AI SYSTEM</text><text x="715" y="305" fill="#e8efff"> online</text>
    <text x="588" y="330" fill="#00f7ff">&gt;_</text>
    <rect x="620" y="316" width="9" height="18" fill="#00f7ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <g opacity=".45"><circle cx="1010" cy="130" r="5" fill="#ff4fd8"/><circle cx="1030" cy="130" r="5" fill="#7c4dff"/><circle cx="1050" cy="130" r="5" fill="#00f7ff"/></g>
  </g>

  <!-- monitor stand -->
  <path d="M785 372h60v38h-60z" fill="#151d38" stroke="#34436f"/>
  <path d="M730 410h170l28 18H702z" fill="#1b2545" stroke="#34436f"/>

  <!-- desk -->
  <path d="M440 405h650l45 25H395z" fill="#111a31" stroke="#00f7ff" stroke-opacity=".45"/>
  <path d="M465 430v58M1070 430v58" stroke="#26345f" stroke-width="14"/>

  <!-- developer body -->
  <ellipse cx="360" cy="365" rx="90" ry="120" fill="#111827"/>
  <path d="M295 340q65-60 130 0l-10 105H305z" fill="#18223d" stroke="#7c4dff" stroke-width="2"/>
  <path d="M320 350q40 35 80 0v55q-40 35-80 0z" fill="#00a9b8" opacity=".7"/>
  <!-- head -->
  <circle cx="360" cy="255" r="58" fill="#d69a78"/>
  <path d="M302 248q5-75 70-68 50 7 47 70-28-27-63-28-22 0-54 26z" fill="#121826"/>
  <path d="M310 235q15-50 58-55 38 4 50 45-30-18-61-12-23 4-47 22z" fill="#20283d"/>
  <!-- glasses -->
  <g fill="none" stroke="#111827" stroke-width="5"><rect x="318" y="247" width="36" height="24" rx="8"/><rect x="366" y="247" width="36" height="24" rx="8"/><path d="M354 256h12"/></g>
  <!-- arm typing -->
  <path d="M315 355q55 30 115 55l-15 24q-72-20-125-55z" fill="#d69a78"/>
  <path d="M425 410q-5 14-19 24l-42-28q5-12 18-16z" fill="#d69a78"/>
  <!-- keyboard -->
  <rect x="390" y="420" width="190" height="35" rx="8" fill="#1a2440" stroke="#00f7ff" stroke-opacity=".5" transform="rotate(7 390 420)"/>
  <g fill="#6673a8" opacity=".8"><rect x="410" y="428" width="12" height="7" rx="2"/><rect x="428" y="430" width="12" height="7" rx="2"/><rect x="446" y="432" width="12" height="7" rx="2"/><rect x="464" y="434" width="12" height="7" rx="2"/><rect x="482" y="436" width="12" height="7" rx="2"/><rect x="500" y="438" width="30" height="7" rx="2"/></g>

  <!-- floating UI cards -->
  <g font-family="monospace">
    <rect x="78" y="190" width="245" height="100" rx="16" fill="#0b1227" stroke="#00f7ff" stroke-opacity=".55"/>
    <text x="98" y="220" fill="#00f7ff" font-size="14">CURRENT PROJECT</text>
    <text x="98" y="250" fill="#fff" font-size="20" font-weight="700">DUO TECH</text>
    <text x="98" y="274" fill="#8ea1c9" font-size="13">AI • WEB • PRODUCT</text>
    <rect x="900" y="400" width="220" height="65" rx="14" fill="#0b1227" stroke="#ff4fd8" stroke-opacity=".55"/>
    <text x="920" y="427" fill="#ff7bdc" font-size="13">BUILD PIPELINE</text>
    <text x="920" y="450" fill="#eafaff" font-size="13">██████████ 100%</text>
  </g>

  <text x="70" y="490" fill="#536486" font-family="monospace" font-size="13">TRAN VAN THUAN  •  SOFTWARE ENGINEER  •  FOUNDER  •  VIETNAM</text>
</svg>
