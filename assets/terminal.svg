<rect width="1000" height="330" rx="14" fill="url(#tb)" stroke="#67e8f9" stroke-opacity=".3"/>
<rect width="1000" height="42" rx="14" fill="#161b22"/><rect y="28" width="1000" height="14" fill="#161b22"/>
