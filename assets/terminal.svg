  <animate attributeName="opacity" values="0;1" dur="0.1s" begin="9s" fill="freeze"/></text>
 <rect x="275" y="261" width="10" height="20" fill="#67e8f9" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1s" begin="9s" repeatCount="indefinite"/></rect>
</g>
