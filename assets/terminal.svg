 <g clip-path="url(#l2)"><text x="40" y="124" fill="#a5b4fc">name    <tspan fill="#e6edf3">→ Trần Văn Thuần (Felix)</tspan></text></g>
 <g clip-path="url(#l3)"><text x="40" y="158" fill="#a5b4fc">role    <tspan fill="#e6edf3">→ Founder &amp; CEO, DUOTECH TECHNOLOGY</tspan></text></g>
 <g clip-path="url(#l4)"><text x="40" y="192" fill="#a5b4fc">study   <tspan fill="#e6edf3">→ Software Engineering, FPT University</tspan></text></g>
