<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">About Felix — animated developer profile</title>
<desc id="desc">Animated technology profile card introducing Tran Van Thuan, founder and CEO of DUOTECH TECHNOLOGY, software engineering student at FPT University.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#f1f5ff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#0ea5e9"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#0891b2" stop-opacity=".26"/><stop offset="1" stop-color="#7c3aed" stop-opacity=".02"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="688" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="690" fill="url(#bg)"/>
  <rect width="1200" height="690" fill="url(#grid)"/>
  <circle cx="110" cy="100" r="170" fill="#0891b2" opacity=".15" filter="url(#blur)"><animate attributeName="cx" values="110;250;110" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="540" r="190" fill="#7c3aed" opacity=".18" filter="url(#blur)"><animate attributeName="cy" values="540;390;540" dur="14s" repeatCount="indefinite"/></circle>
  <path d="M0 180 C250 110 400 250 650 170 S1000 110 1200 170" fill="none" stroke="#0ea5e9" stroke-opacity=".18" stroke-width="2">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 180 C250 110 400 250 650 170 S1000 110 1200 170;M0 160 C250 240 400 100 650 190 S1000 240 1200 150;M0 180 C250 110 400 250 650 170 S1000 110 1200 170"/>
  </path>
  <rect x="18" y="18" width="1164" height="654" rx="18" fill="none" stroke="url(#edge)" stroke-opacity=".8" stroke-width="1.5"/>
  <rect x="38" y="38" width="1124" height="614" rx="13" fill="#ffffff" fill-opacity=".9" stroke="#94a3b8" stroke-opacity=".18"/>
  <path d="M740 38V652" stroke="#94a3b8" stroke-opacity=".25"/>
  <rect x="62" y="62" width="165" height="34" rx="6" fill="#0891b2" fill-opacity=".2" stroke="#0ea5e9" stroke-opacity=".65"/>
  <text x="78" y="84" fill="#0369a1" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">HELLO, I'M FELIX</text>
  <circle cx="1110" cy="79" r="5" fill="#0ea5e9"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="62" y="150" fill="#0f172a" font-family="Arial,sans-serif" font-size="34" font-weight="700">I turn ideas into products</text>
  <text x="62" y="190" fill="#0369a1" font-family="Arial,sans-serif" font-size="34" font-weight="700">people can use.</text>
  <text x="62" y="242" fill="#334155" font-family="Arial,sans-serif" font-size="18">I'm Trần Văn Thuần (Felix) — a Software Engineering student at</text>
  <text x="62" y="270" fill="#334155" font-family="Arial,sans-serif" font-size="18">FPT University, and Founder &amp; CEO of DUOTECH TECHNOLOGY.</text>
  <text x="62" y="322" fill="#475569" font-family="Arial,sans-serif" font-size="17">Working across engineering, AI, and product development — from</text>
  <text x="62" y="349" fill="#475569" font-family="Arial,sans-serif" font-size="17">understanding business problems to delivering practical solutions.</text>
  <text x="62" y="401" fill="#475569" font-family="Arial,sans-serif" font-size="17">Clear thinking → thoughtful design → reliable engineering → impact.</text>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700">
    <rect x="62" y="438" width="190" height="32" rx="5" fill="#e0f2fe" fill-opacity="1" stroke="#0ea5e9" stroke-opacity=".5"/><text x="77" y="459" fill="#075985">SOFTWARE ENGINEERING</text>
    <rect x="262" y="438" width="150" height="32" rx="5" fill="#ede9fe" fill-opacity="1" stroke="#a78bfa" stroke-opacity=".5"/><text x="280" y="459" fill="#5b21b6">AI APPLICATIONS</text>
    <rect x="422" y="438" width="158" height="32" rx="5" fill="#dbeafe" fill-opacity="1" stroke="#60a5fa" stroke-opacity=".5"/><text x="441" y="459" fill="#1e40af">PRODUCT THINKING</text>
  </g>
  <path d="M62 525V603" stroke="#0ea5e9" stroke-width="3"/>
  <text x="82" y="553" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Build with purpose.</text>
  <text x="82" y="584" fill="#475569" font-family="Arial,sans-serif" font-size="17">Engineer with clarity. Create real impact.</text>
  <text x="778" y="94" fill="#0369a1" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROFILE / 2026</text>
  <text x="778" y="142" fill="#0f172a" font-family="Arial,sans-serif" font-size="25" font-weight="700">A little about me</text>
  <g font-family="Arial,sans-serif" font-size="16">
    <text x="778" y="198" fill="#64748b">ROLE</text><text x="920" y="198" fill="#0f172a" font-weight="700">Founder &amp; CEO</text><path d="M778 215H1125" stroke="#64748b" stroke-opacity=".35"/>
    <text x="778" y="248" fill="#64748b">COMPANY</text><text x="920" y="248" fill="#0f172a" font-weight="700">DUOTECH TECHNOLOGY</text><path d="M778 265H1125" stroke="#64748b" stroke-opacity=".35"/>
    <text x="778" y="298" fill="#64748b">STUDY</text><text x="920" y="298" fill="#0f172a" font-weight="700">Software Engineering</text><path d="M778 315H1125" stroke="#64748b" stroke-opacity=".35"/>
    <text x="778" y="348" fill="#64748b">CAMPUS</text><text x="920" y="348" fill="#0f172a" font-weight="700">FPT University</text><path d="M778 365H1125" stroke="#64748b" stroke-opacity=".35"/>
    <text x="778" y="398" fill="#64748b">INTERESTS</text><text x="920" y="398" fill="#0f172a" font-weight="700">Software · AI · Product</text>
  </g>
  <text x="778" y="464" fill="#0f172a" font-family="Arial,sans-serif" font-size="19" font-weight="700">CURRENTLY FOCUSED ON</text>
  <g fill="#475569" font-family="Arial,sans-serif" font-size="16">
    <circle cx="786" cy="501" r="4" fill="#0ea5e9"/><text x="802" y="507">Building useful digital products</text>
    <circle cx="786" cy="535" r="4" fill="#0ea5e9"/><text x="802" y="541">Applying AI to real workflows</text>
    <circle cx="786" cy="569" r="4" fill="#0ea5e9"/><text x="802" y="575">Connecting business and technology</text>
    <circle cx="786" cy="603" r="4" fill="#0ea5e9"/><text x="802" y="609">Growing teams through execution</text>
  </g>
  <rect x="0" y="638" width="1200" height="52" fill="#eef2ff" fill-opacity="1"/>
  <path d="M0 638H1200" stroke="url(#edge)" stroke-width="2" opacity=".8"/>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#4338ca">
    <text y="670">BUILD WITH PURPOSE  ·  ENGINEER WITH CLARITY  ·  CREATE REAL IMPACT  ·  </text>
    <text y="670" x="1200">BUILD WITH PURPOSE  ·  ENGINEER WITH CLARITY  ·  CREATE REAL IMPACT  ·  <animate attributeName="x" values="1200;0" dur="18s" repeatCount="indefinite"/></text>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1200 0" dur="18s" repeatCount="indefinite"/>
  </g>
</g>
</svg>