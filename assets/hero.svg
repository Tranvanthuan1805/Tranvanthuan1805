<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
 <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#0284c7"/><stop offset=".5" stop-color="#1e1b4b"/><stop offset="1" stop-color="#7c3aed"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0ea5e9" stop-opacity="0"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
 <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0ea5e9" stop-opacity="0"/><stop offset=".5" stop-color="#0ea5e9" stop-opacity=".18"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#0ea5e9" stop-opacity=".45"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0369a1" stroke-opacity=".12"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
 <clipPath id="card"><rect width="1200" height="400" rx="26"/></clipPath>
</defs>
<g clip-path="url(#card)">
 <rect width="1200" height="400" fill="url(#bg)"/>
 <rect width="1200" height="400" fill="url(#grid)"/>
 <circle cx="220" cy="90" r="190" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="220;420;220" dur="14s" repeatCount="indefinite"/></circle>
 <circle cx="1000" cy="320" r="200" fill="#8b5cf6" opacity=".22" filter="url(#blur)"><animate attributeName="cy" values="320;120;320" dur="11s" repeatCount="indefinite"/></circle>

 <!-- scanning beam -->
 <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)"><animate attributeName="y" values="-80;400" dur="6s" repeatCount="indefinite"/></rect>

 <!-- orbit rings -->
 <g fill="none" stroke="#818cf8" stroke-opacity=".25" transform="translate(600 200)">
  <ellipse rx="430" ry="120"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="40s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="330" ry="90" stroke="#0ea5e9"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="30s" repeatCount="indefinite"/></ellipse>
  <circle r="4" fill="#0284c7" stroke="none"><animateMotion dur="9s" repeatCount="indefinite" path="M-330 0 A330 90 0 1 1 330 0 A330 90 0 1 1 -330 0"/></circle>
  <circle r="3" fill="#7c3aed" stroke="none"><animateMotion dur="14s" repeatCount="indefinite" path="M430 0 A430 120 0 1 0 -430 0 A430 120 0 1 0 430 0"/></circle>
 </g>

 <!-- waves -->
 <g fill="none" stroke="url(#line)" stroke-width="1.5">
  <path d="M0 330 Q300 230 600 320 T1200 250"><animate attributeName="d" values="M0 330 Q300 230 600 320 T1200 250;M0 290 Q300 380 600 260 T1200 320;M0 330 Q300 230 600 320 T1200 250" dur="9s" repeatCount="indefinite"/></path>
  <path d="M0 360 Q300 270 600 350 T1200 290" opacity=".45"><animate attributeName="d" values="M0 360 Q300 270 600 350 T1200 290;M0 330 Q300 400 600 300 T1200 350;M0 360 Q300 270 600 350 T1200 290" dur="12s" repeatCount="indefinite"/></path>
 </g>

 <!-- floating code glyphs -->
 <g font-family="'JetBrains Mono',Consolas,monospace" font-size="16" fill="#0284c7" opacity=".5">
  <text x="90" y="120">&lt;/&gt;<animate attributeName="y" values="120;100;120" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.7;.2" dur="5s" repeatCount="indefinite"/></text>
  <text x="1070" y="140" fill="#7c3aed">{ }<animate attributeName="y" values="140;118;140" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.2;.7" dur="6s" repeatCount="indefinite"/></text>
  <text x="170" y="320" fill="#6366f1">SELECT *<animate attributeName="y" values="320;300;320" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.7;.2" dur="7s" repeatCount="indefinite"/></text>
  <text x="980" y="330">=&gt; AI<animate attributeName="y" values="330;310;330" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.2;.7" dur="8s" repeatCount="indefinite"/></text>
 </g>

 <!-- stars -->
 <g fill="#38bdf8">
  <circle cx="110" cy="60" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="70" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="45" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="50" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
 </g>

 <!-- text -->
 <text x="600" y="135" text-anchor="middle" fill="#0369a1" font-family="Arial,sans-serif" font-size="15" letter-spacing="7">SOFTWARE ENGINEERING · AI · PRODUCT
  <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
 <text x="600" y="215" text-anchor="middle" fill="url(#name)" font-family="Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="2">TRẦN VĂN THUẦN
  <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/></text>
 <text x="600" y="255" text-anchor="middle" fill="#7c3aed" font-family="Arial,sans-serif" font-size="21" letter-spacing="6">FELIX</text>
 <rect x="410" y="278" width="380" height="1.5" rx="1" fill="url(#line)"><animate attributeName="width" values="0;380" dur="1.8s" fill="freeze"/></rect>
 <text x="600" y="312" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">FOUNDER &amp; CEO  ·  DUOTECH TECHNOLOGY  ·  FPT UNIVERSITY</text>
</g>
<rect x=".75" y=".75" width="1198.5" height="398.5" rx="26" fill="none" stroke="#0284c7" stroke-opacity=".35"/>
</svg>
