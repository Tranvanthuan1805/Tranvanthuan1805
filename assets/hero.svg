<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".52" stop-color="#101b3b"/><stop offset="1" stop-color="#25104b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".42"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="line"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#93c5fd" stroke-opacity=".09"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#grid)"/>
<circle cx="230" cy="80" r="180" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="230;390;230" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="280" r="190" fill="#8b5cf6" opacity=".18" filter="url(#blur)"><animate attributeName="cy" values="280;120;280" dur="10s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="url(#line)" stroke-width="1.5"><path d="M0 270 Q300 160 600 260 T1200 190"><animate attributeName="d" values="M0 270 Q300 160 600 260 T1200 190;M0 220 Q300 330 600 190 T1200 260;M0 270 Q300 160 600 260 T1200 190" dur="9s" repeatCount="indefinite"/></path><path d="M0 300 Q300 200 600 290 T1200 220" opacity=".5"/></g>
<g fill="#bae6fd"><circle cx="100" cy="80" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="1080" cy="90" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="930" cy="50" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle></g>
<text x="600" y="125" text-anchor="middle" fill="#93c5fd" font-family="Arial,sans-serif" font-size="15" letter-spacing="7">SOFTWARE ENGINEERING · AI · PRODUCT</text>
<text x="600" y="195" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="2">TRẦN VĂN THUẦN</text>
<text x="600" y="235" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="21" letter-spacing="5">FELIX</text>
<rect x="430" y="265" width="340" height="1.5" rx="1" fill="url(#line)"/>
<text x="600" y="302" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">FOUNDER &amp; CEO  ·  DUOTECH TECHNOLOGY</text>
</svg>