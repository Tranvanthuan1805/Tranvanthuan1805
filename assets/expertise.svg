fe"/><g><rect x="434" y="34" width="52" height="52" fill="#ddd6fe" stroke="#0f172a" stroke-width="4"/><text x="460.0" y="66.3" text-anchor="middle" font-size="18" fill="#0f172a">AI</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></g><text x="502" y="66" font-size="17" fill="#0f172a">AI APPLICATIONS</text><text x="434" y="114" font-size="13" fill="#475569">Bring AI capabilities into useful products</text><text x="434" y="134" font-size="13" fill="#475569">and everyday workflows.</text><rect x="434" y="184" width="12" height="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="458" y="195" font-size="15" fill="#0f172a">LLM &amp; AI API integration</text><rect x="434" y="218" width="12" height="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="458" y="229" font-size="15" fill="#0f172a">AI chatbots and assistants</text><rect x="434" y="252" width="12" height="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="458" y="263" font-size="15" fill="#0f172a">AI-powered applications</text><rect x="434" y="286" width="12" height="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="458" y="297" font-size="15" fill="#0f172a">Workflow automation</text><rect x="820" y="20" width="376" height="330" fill="#0f172a"/><rect x="812" y="12" width="376" height="330" fill="#fff" stroke="#0f172a" stroke-width="4"/><rect x="816" y="16" width="368" height="6" fill="#e0f2fe"/><g><rect x="834" y="34" width="52" height="52" fill="#bbf7d0" stroke="#0f172a" stroke-width="4"/><text x="860.0" y="66.3" text-anchor="middle" font-size="18" fill="#0f172a">PM</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></g><text x="902" y="66" font-size="17" fill="#0f172a">PRODUCT &amp; LEADERSHIP</text><text x="834" y="114" font-size="13" fill="#475569">Connect business objectives with</text><